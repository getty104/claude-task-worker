# OpenCodeReview - PR Auto-Review Workflow
#
# Thin wrapper around the upstream composite action (alibaba/open-code-review),
# which installs OCR, runs the review and posts inline comments + a sticky summary.
# This wrapper adds:
#   - background context (PR description, linked issues, already-posted comments)
#   - Japanese output and routing of below-"high" findings to the summary
#   - a fail-closed guard: an errored or incomplete review never reads as LGTM
#
# Required secrets:
#   OCR_LLM_URL        - LLM API endpoint (e.g., https://api.openai.com/v1/chat/completions)
#   OCR_LLM_AUTH_TOKEN - Authentication token for the LLM API
#
# Optional secrets:
#   OCR_LLM_MODEL          - Model name (no default in OCR; set it unless your endpoint picks one)
#   OCR_LLM_USE_ANTHROPIC  - Use Anthropic-compatible API ('true' / 'false', default 'false')
#
# Note: GITHUB_TOKEN is automatically provided by GitHub Actions.
#
# This repository is public, so the job guards are stricter than a private-repo setup:
#   - `pull_request` runs only for same-repo branches (fork PRs get no secrets).
#   - `issue_comment` triggers only for OWNER / MEMBER / COLLABORATOR comments,
#     so drive-by comments cannot spend LLM credits.

name: OpenCodeReview PR Review

on:
  pull_request:
  issue_comment:
    types: [created]

# The group key includes the event name on purpose. GitHub evaluates `concurrency`
# before any job-level `if:`, so an `issue_comment` run (e.g. a bot comment that the
# preflight guard immediately skips) would otherwise take over the group and cancel
# the in-progress `pull_request` review, leaving the PR without a review.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  # Secrets cannot be referenced in a job-level `if:`, so the enablement check lives
  # in its own job. Without the LLM secrets the review is skipped (not failed), so
  # repositories that have not configured OCR yet do not get a red check on every PR.
  preflight:
    runs-on: ubuntu-latest
    # Run on same-repo PR events, or on comments starting with trigger keywords
    # posted by someone with write access.
    if: |
      (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
        (startsWith(github.event.comment.body, '/open-code-review') ||
         startsWith(github.event.comment.body, '@open-code-review')))
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Check OCR secrets
        id: check
        env:
          OCR_LLM_URL: ${{ secrets.OCR_LLM_URL }}
          OCR_LLM_AUTH_TOKEN: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
        run: |
          if [ -n "$OCR_LLM_URL" ] && [ -n "$OCR_LLM_AUTH_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::OCR_LLM_URL / OCR_LLM_AUTH_TOKEN are not configured. Skipping OpenCodeReview."
          fi

  code-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: preflight
    if: needs.preflight.outputs.enabled == 'true'
    steps:
      - name: Get PR context
        id: pr-context
        if: github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            // issue_comment payloads carry no base/head, so the action needs them as inputs.
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            core.setOutput('base_ref', pullRequest.base.ref);
            core.setOutput('head_sha', pullRequest.head.sha);

      - name: Collect review background context
        id: background
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.payload.pull_request?.number || context.issue.number;

            // Fetch PR details for title and description
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            // Extract linked issue numbers from the PR body
            // Pick up both GitHub "closing" keywords (close/fix/resolve [#N]) and bare #N references
            const prBody = pr.body || '';
            const issueNumbers = new Set();
            const closingPattern = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)\b/gi;
            const refPattern = /(?:^|[^&\w])#(\d+)\b/g;
            for (const re of [closingPattern, refPattern]) {
              let m;
              while ((m = re.exec(prBody)) !== null) {
                issueNumbers.add(Number(m[1]));
              }
            }
            issueNumbers.delete(prNumber);

            // Fetch each referenced issue (skip PR references and anything we can't read)
            const linkedIssues = [];
            for (const n of issueNumbers) {
              try {
                const { data: issue } = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: n,
                });
                if (issue.pull_request) continue;
                linkedIssues.push(issue);
              } catch (e) {
                console.log(`Skipping #${n}: ${e.message}`);
              }
            }

            // Fetch all existing inline review comments across pages
            const comments = await github.paginate(
              github.rest.pulls.listReviewComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                per_page: 100,
              }
            );

            // NOTE: This block is injected under OCR's `### Requirement Background (Optional)`
            // heading, so top-level sections start at h4 (####) and sub-entries at h5 (#####).
            const sections = [
              'Below is contextual information for this code review:',
              '- The pull request description',
              '- Linked issue descriptions',
              '- Review comments that have already been posted (do not duplicate them)',
              '',
              '#### Pull Request Description',
              '',
              `##### ${pr.title || ''}`,
              '',
              (prBody || '(no description)').trim(),
              '',
            ];

            if (linkedIssues.length > 0) {
              sections.push('#### Linked Issues');
              sections.push('');
              for (const issue of linkedIssues) {
                sections.push(`##### #${issue.number}: ${issue.title || ''}`);
                sections.push('');
                sections.push((issue.body || '(no description)').trim());
                sections.push('');
              }
            }

            if (comments.length > 0) {
              sections.push('#### Already-posted review comments');
              sections.push('');
              sections.push('The following comments have ALREADY been posted on this pull request.');
              sections.push('Do NOT generate the same or similar comments for issues already covered below.');
              sections.push('Focus on identifying NEW issues that have not yet been pointed out.');
              sections.push('');
              for (const c of comments) {
                const path = c.path || '(unknown)';
                const start = c.start_line;
                const end = c.line ?? c.original_line;
                const lineInfo = start && end && start !== end
                  ? `L${start}-L${end}`
                  : `L${end ?? start ?? '?'}`;
                sections.push(`##### ${path} (${lineInfo})`);
                sections.push('');
                sections.push((c.body || '').trim());
                sections.push('');
              }
            }

            core.setOutput('text', sections.join('\n'));
            console.log(
              `Background context: PR description + ${linkedIssues.length} linked issue(s) + ${comments.length} existing comment(s).`
            );

      - name: Run OpenCodeReview
        id: ocr
        uses: alibaba/open-code-review@76ab46ac20f08a8bd8ac38881a8a826c7cb6495f # v1.13.4
        with:
          ocr_version: 1.13.4
          llm_url: ${{ secrets.OCR_LLM_URL }}
          llm_auth_token: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          llm_model: ${{ secrets.OCR_LLM_MODEL }}
          # The action treats an empty value as Anthropic; keep OpenAI-compatible as the default.
          llm_use_anthropic: ${{ secrets.OCR_LLM_USE_ANTHROPIC || 'false' }}
          # The action defaults to {"thinking":{"type":"disabled"}}, which some OpenAI-compatible
          # endpoints reject as an unknown field; send no extra body as before.
          llm_extra_body: '{}'
          language: Japanese
          background: ${{ steps.background.outputs.text }}
          base_ref: ${{ steps.pr-context.outputs.base_ref }}
          head_sha: ${{ steps.pr-context.outputs.head_sha }}
          # Findings below "high" go to the summary comment instead of inline.
          route_severity_below: medium
          sticky_summary: 'true'
          upload_artifacts: 'true'

      # Upstream posts "✅ <message>" whenever OCR exits 0 with no findings, even when some
      # files failed to review, and posts nothing when OCR exits non-zero. Never let either read as LGTM.
      - name: Fail on errored or incomplete review
        if: ${{ !cancelled() }}
        uses: actions/github-script@v7
        env:
          OCR_OUTCOME: ${{ steps.ocr.outcome }}
          SUMMARY_URL: ${{ steps.ocr.outputs.summary_comment_url }}
          COMMENTS_TOTAL: ${{ steps.ocr.outputs.comments_total }}
        with:
          script: |
            const fs = require('fs');
            const issue_number = context.issue.number;
            const { owner, repo } = context.repo;
            const read = (p) => { try { return fs.readFileSync(p, 'utf8'); } catch { return ''; } };

            let result = null;
            try { result = JSON.parse(read('/tmp/ocr-result.json')); } catch { /* handled below */ }

            if (process.env.OCR_OUTCOME !== 'success' || !result) {
              // Upstream already posted stderr to the summary when OCR exited 0 with unparsable output.
              if (process.env.OCR_OUTCOME === 'success' && process.env.SUMMARY_URL) {
                core.setFailed('OpenCodeReview output could not be parsed.');
                return;
              }
              let stderr = read('/tmp/ocr-stderr.log').trim();
              // Keep the tail: the fatal error is printed last, and comments are capped at 65536 chars.
              if (stderr.length > 20000) stderr = '…\n' + stderr.slice(-20000);
              const reason = process.env.OCR_OUTCOME !== 'success'
                ? `OpenCodeReview のステップが失敗しました（outcome: \`${process.env.OCR_OUTCOME || 'unknown'}\`）。`
                : 'OpenCodeReview の出力を解析できませんでした。';
              let body = `❌ **OpenCodeReview** failed — レビューは完了していません（LGTM ではありません）。\n\n${reason}`;
              body += stderr ? `\n\n${fencedBlock(stderr)}` : '\n\n詳細はワークフローのログを確認してください。';
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
              core.setFailed(reason);
              return;
            }

            const status = String(result.status || '').toLowerCase();
            const warnings = result.warnings || [];
            // complete/success/skipped are clean; anything else (partial, failed, completed_with_errors,
            // completed_with_warnings) means part of the diff was not reviewed.
            const CLEAN = ['complete', 'success', 'skipped'];
            if (CLEAN.includes(status) && warnings.length === 0) return;

            core.setFailed(`OpenCodeReview review is incomplete (status: ${status || 'unknown'}, ${warnings.length} warning(s)).`);

            // With findings, upstream's summary already lists them with the warnings. Only the
            // no-findings summary claims "✅", so rewrite it.
            const match = /#issuecomment-(\d+)$/.exec(process.env.SUMMARY_URL || '');
            if (Number(process.env.COMMENTS_TOTAL || 0) > 0 || !match) return;
            const comment_id = Number(match[1]);
            const { data: summary } = await github.rest.issues.getComment({ owner, repo, comment_id });
            const banner = `⚠️ **OpenCodeReview**: レビューが完了しなかったため LGTM ではありません（status: \`${status || 'unknown'}\`）。`;
            const body = summary.body.replace(/^✅ \*\*OpenCodeReview\*\*:.*$/m, banner) + formatWarnings(warnings);
            await github.rest.issues.updateComment({ owner, repo, comment_id, body });

            // warnings entries are {file, type, message} objects in current OCR, strings in older ones.
            function formatWarnings(list) {
              if (list.length === 0) return '';
              let out = `\n\n⚠️ ${list.length} warning(s) occurred during review (一部ファイルは未レビュー):`;
              for (const w of list) {
                const text = w && typeof w === 'object'
                  ? [[w.file && `\`${w.file}\``, w.type && `(\`${w.type}\`)`].filter(Boolean).join(' '), w.message].filter(Boolean).join(': ')
                  : String(w);
                out += `\n- ${String(text).replace(/\s+/g, ' ').slice(0, 500)}`;
              }
              return out;
            }

            function fencedBlock(text) {
              const ticks = (text.match(/`+/g) || []).reduce((m, t) => Math.max(m, t.length), 0);
              const fence = '`'.repeat(Math.max(3, ticks + 1));
              return `${fence}\n${text}\n${fence}`;
            }
